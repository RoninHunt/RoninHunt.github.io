<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phrog Productions</title>
     <script src="https://vimeo.com"></script>
    <style>
        body {
            background-color: #618C56;
            font-family: Lexend Giga, sans-serif;
        }
        h1 {
            color: #FFF86E;
            text-align: center;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #666666;
        }
        /* Optional basic styling to center the video */
        .video-container {
            width: 640px;
            margin: 50px auto;
        }
        iframe {
            width: 100%;
            height: 360px;
            border: none;
        }
    </style>
</head>
     <script>
        // Ensure code runs after DOM elements exist
        document.addEventListener('DOMContentLoaded', function() {
            const iframe = document.getElementById('roninvid');
            const player = new Vimeo.Player(iframe);

            // Play the video when the mouse moves over the iframe
            iframe.addEventListener('mouseenter', function() {
                player.play().catch(function(error) {
                    console.error("Playback failed:", error);
                });
            });

            // Pause the video when the mouse leaves the iframe
            iframe.addEventListener('mouseleave', function() {
                player.pause();
            });
        });
    </script>

 
          <iframe id="roninvid" src="https://player.vimeo.com/video/1216589613?title=0&amp;byline=0&amp;portrait=0&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" allow="autoplay; fullscreen; " referrerpolicy="strict-origin-when-cross-origin" >
              
          </iframe><script src="https://player.vimeo.com/api/player.js"></script>
</html>
